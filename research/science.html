<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>자연과학사 — 연구 자료 | Archive for Som & Chan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="../assets/shared/styles-base.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="shared-body collection-science" data-page-id="research.science">

<main class="research">
  <section class="research-hero">
    <div class="shared-container">
      <span class="kicker">§ III</span>
      <h1>자연과학사 — 연구 자료</h1>
      <p class="subtitle">Natural Science History Research</p>
      <p class="lead">
        탈레스부터 양자컴퓨터까지. 자연과학사 통사 작성에 참고한 출처, 변경 이력, 학설 갈래 결정 기록.
      </p>
    </div>
  </section>

  <div class="shared-container">
    <div class="research-stats" id="sc-stats">
      <div class="stat"><span class="stat-num">…</span><span class="stat-label">출처</span></div>
      <div class="stat"><span class="stat-num">…</span><span class="stat-label">업데이트</span></div>
      <div class="stat"><span class="stat-num">…</span><span class="stat-label">노트</span></div>
    </div>

    <section class="research-section">
      <header>
        <h2>출처</h2>
        <span class="count">신뢰도 순</span>
      </header>
      <div id="sc-sources"></div>
    </section>

    <section class="research-section">
      <header>
        <h2>업데이트 이력</h2>
        <span class="count">시간 역순</span>
      </header>
      <div id="sc-updates"></div>
    </section>

    <section class="research-section">
      <header>
        <h2>연구 노트</h2>
        <span class="count">결정 기록</span>
      </header>
      <div id="sc-notes"></div>
    </section>
  </div>
</main>

<script>window.SITE_ROOT = '/';</script>
<script src="../assets/shared/nav.js" defer></script>
<script src="../assets/shared/footer.js" defer></script>
<script src="../assets/shared/research-loader.js" defer></script>
<script>
  window.addEventListener('load', function () {
    ResearchLoader.load('science').then(function (data) {
      ResearchLoader.renderStats(data, '#sc-stats');
      ResearchLoader.renderSources(data.sources, '#sc-sources');
      ResearchLoader.renderUpdates(data.updates, '#sc-updates');
      ResearchLoader.renderNotes(data.notes, '#sc-notes');
    });
  });
</script>
</body>
</html>
