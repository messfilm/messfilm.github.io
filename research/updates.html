<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>전체 업데이트 이력 | 연구 아카이브</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="../assets/shared/styles-base.css">
<link rel="stylesheet" href="styles.css">

<style>
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 24px 0;
    padding: 16px 18px;
    background: var(--paper-light);
    border: 1px solid var(--rule);
    align-items: center;
  }
  .filter-bar .filter-label {
    font-family: var(--sans-ko);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-right: 8px;
  }
  .filter-bar button {
    font-family: var(--sans-ko);
    font-size: 12px;
    padding: 5px 12px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s;
  }
  .filter-bar button:hover { background: var(--paper-dark); }
  .filter-bar button.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
</style>
</head>
<body class="shared-body collection-research" data-page-id="research.updates">

<main class="research">
  <section class="research-hero">
    <div class="shared-container">
      <span class="kicker">◇</span>
      <h1>전체 업데이트 이력</h1>
      <p class="subtitle">All Updates — Combined Timeline</p>
      <p class="lead">
        세 프로젝트의 모든 변경 사항을 시간 역순으로 모아 보여줍니다.
        프로젝트별로 필터링할 수 있습니다.
      </p>
    </div>
  </section>

  <div class="shared-container">
    <div class="filter-bar" role="toolbar" aria-label="프로젝트 필터">
      <span class="filter-label">프로젝트</span>
      <button class="filter active" data-filter="all">전체</button>
      <button class="filter" data-filter="religion">종교사</button>
      <button class="filter" data-filter="korean">한국사</button>
      <button class="filter" data-filter="science">자연과학사</button>
    </div>
    <div id="all-updates"></div>
  </div>
</main>

<script>window.SITE_ROOT = '/';</script>
<script src="../assets/shared/nav.js" defer></script>
<script src="../assets/shared/footer.js" defer></script>
<script src="../assets/shared/research-loader.js" defer></script>
<script>
  window.addEventListener('load', function () {
    var allData = null;
    function applyFilter(filter) {
      var list = filter === 'all'
        ? allData.updates
        : allData.updates.filter(function (u) { return u.project === filter; });
      ResearchLoader.renderUpdates(list, '#all-updates');
    }
    ResearchLoader.load('all').then(function (data) {
      allData = data;
      applyFilter('all');
    });
    document.querySelectorAll('.filter-bar .filter').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.filter-bar .filter').forEach(function (b) {
          b.classList.remove('active');
        });
        btn.classList.add('active');
        if (allData) applyFilter(btn.dataset.filter);
      });
    });
  });
</script>
</body>
</html>
